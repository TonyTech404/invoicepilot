name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'infra/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to Azure: no stored Azure credentials
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w api

      - name: Build web and API
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/migrate.mjs

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "${{ vars.SWA_NAME }}" -g rg-invoicepilot --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: web/dist
          api_location: api/dist
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            body=$(curl -fsS "https://${{ vars.SWA_HOSTNAME }}/api/health" || true)
            echo "$body"
            echo "$body" | grep -q "${{ github.sha }}" && exit 0
            sleep 10
          done
          echo "The new version did not come up" && exit 1
