name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # A dedicated Neon branch for integration tests. Without it (forks), those tests are skipped.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate test database
        if: env.TEST_DATABASE_URL != ''
        run: node scripts/migrate.mjs
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Tests (unit, plus integration against Postgres)
        run: npm test
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Build
        run: npm run build
